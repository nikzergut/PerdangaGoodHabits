<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PerdangaGoodHabits</title>
    <script type="module" src="./main.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="masthead-main">
          <p class="kicker">
            дневник дисциплины
            <span id="mode-badge" class="mode-badge hidden">веб</span>
          </p>
          <h1 class="title">Привычки</h1>
        </div>
        <div class="masthead-side">
          <p class="range-note" id="range-note">14 дней в окне</p>
          <div class="range-controls" aria-label="Навигация по датам">
            <button id="prev-range" class="control-btn" type="button">Назад</button>
            <button id="today-range" class="control-btn control-btn--solid" type="button">Сегодня</button>
            <button id="next-range" class="control-btn" type="button">Вперёд</button>
            <div class="calendar-picker">
              <button
                id="calendar-btn"
                class="control-btn control-btn--icon"
                type="button"
                aria-label="Открыть календарь"
                aria-controls="date-picker"
                title="Выбрать дату"
              >
                <svg class="calendar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="3" y="5" width="18" height="16" rx="0"></rect>
                  <path d="M8 3v4M16 3v4M3 9h18"></path>
                </svg>
              </button>
              <input
                id="date-picker"
                class="date-picker-input"
                type="date"
                min="1900-01-01"
                max="2100-12-31"
                tabindex="-1"
                aria-label="Выбрать дату"
              />
            </div>
          </div>
        </div>
      </header>

      <section class="composer" aria-label="Добавить привычку">
        <form id="add-form" class="composer-form">
          <label class="composer-label" for="habit-name">Новая привычка</label>
          <div class="composer-row">
            <input
              id="habit-name"
              class="composer-input"
              type="text"
              maxlength="80"
              placeholder="читать, бегать, писать..."
              autocomplete="off"
            />
            <button type="submit" class="control-btn control-btn--solid control-btn--add">Добавить</button>
          </div>
        </form>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section class="board-wrap" aria-label="Таблица привычек">
        <div class="board-scroll">
          <table class="board">
            <thead>
              <tr id="days-row">
                <th class="habit-col sticky-col">
                  <div class="head-cell head-cell--habit">Привычка</div>
                </th>
              </tr>
            </thead>
            <tbody id="board-body"></tbody>
          </table>
        </div>
        <div id="empty-state" class="empty-state hidden">
          <p class="empty-title">Пока пусто</p>
          <p class="empty-copy">Добавь привычку выше. Таблица заполнится днями и чекбоксами.</p>
        </div>
      </section>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему" data-no-busy="true">
        <span class="theme-toggle-icon" aria-hidden="true">◐</span>
        <span class="theme-toggle-text">Тема</span>
      </button>
    </div>
  </body>
</html>
